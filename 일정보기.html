<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="일정 보기">
<meta name="theme-color" content="#161A21">
<meta name="robots" content="noindex">
<title>일정 · 보기</title>
<style>
  html[data-t="dark"]{ --bg:#161A21; --s1:#1F242D; --s2:#28303A; --tx:#EFE9E0; --mu:#9AA3AE;
    --ln:#333C47; --jade:#6DB29C; --amber:#E2AE58; --steel:#8B98AA; --red:#DE8171; }
  html[data-t="light"]{ --bg:#F1F1ED; --s1:#FBFBF8; --s2:#E7E8E1; --tx:#22262B; --mu:#77807C;
    --ln:#DEDFD8; --jade:#3B7A66; --amber:#9C6E18; --steel:#647285; --red:#B85446; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--tx);
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding:16px 13px calc(40px + env(safe-area-inset-bottom)); font-size:16px; line-height:1.6; letter-spacing:-.005em}
  #app{max-width:620px; margin:0 auto}
  .n{font-variant-numeric:tabular-nums}
  #top{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-bottom:4px}
  .d{font-size:30px; font-weight:700; line-height:1}
  .ro{display:inline-block; font-size:11px; color:var(--mu); border:1px solid var(--ln); border-radius:999px; padding:3px 9px}
  .c{background:var(--s1); border:1px solid var(--ln); border-radius:18px; padding:14px 15px; margin-bottom:12px}
  .anc{font-size:12px; color:var(--mu); margin:22px 4px 9px; letter-spacing:.02em}
  .hint{font-size:13px; color:var(--mu); line-height:1.7}
  .ev{display:flex; align-items:center; gap:9px; padding:11px 0; border-bottom:1px solid var(--ln)}
  .ev:last-child{border-bottom:none}
  .dd{font-size:11px; font-weight:700; color:var(--mu); border:1px solid var(--ln); border-radius:999px; padding:3px 8px; flex:none; min-width:44px; text-align:center}
  .dd.soon{color:var(--bg); background:var(--amber); border-color:var(--amber)}
  .star{color:var(--amber); flex:none}
  .tm{font-size:12px; color:var(--mu); flex:none; width:44px; text-align:right}
  .t{flex:1; min-width:0}
  .dateln{font-size:11px; color:var(--mu); flex:none; width:58px}
  button{font:inherit; font-size:13px; padding:8px 13px; min-height:38px; border:1px solid var(--ln);
    background:var(--s2); color:var(--tx); border-radius:999px; cursor:pointer}
  input{font:inherit; font-size:15px; color:var(--tx); background:var(--bg); border:1px solid var(--ln);
    padding:10px 12px; border-radius:12px; width:100%; -webkit-appearance:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
var DOWK=["월","화","수","목","금","토","일"];
function pad(n){return String(n).padStart(2,"0");}
function dkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function today(){return dkey(new Date());}
function parseK(k){var p=String(k).split("-");return new Date(+p[0],(+p[1])-1,+p[2]);}
function dLeft(ds){var a=parseK(today()),b=parseK(ds);return Math.round((b-a)/86400000);}
function dLabel(n){return n===0?"오늘":n===1?"내일":n<0?(-n)+"일 전":"D-"+n;}
function dowOf(ds){return DOWK[(parseK(ds).getDay()+6)%7];}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}

var theme="dark", data=null, lastAt=0, timer=null, srcUrl=null;
document.documentElement.setAttribute("data-t",theme);

/* 소스 URL 후보: 저장된 것 → raw(main) → raw(master) → 같은 폴더 상대경로 */
function candidates(){
  var saved=null; try{ saved=localStorage.getItem("nunkeum:schedUrl"); }catch(e){}
  var list=[]; if(saved) list.push(saved);
  var host=location.hostname, path=location.pathname, file=(path.split("/").pop()||"");
  var pathFile = file.indexOf(".")>=0 ? file : "";
  var dir = path.replace(/[^\/]*$/,"");             // 같은 폴더
  var repoFile = "events.json";
  // github.io에서 owner/repo 유추
  var m=/^([^.]+)\.github\.io$/.exec(host);
  if(m){
    var owner=m[1];
    var seg=path.split("/").filter(Boolean);
    var repo = seg.length>=2 ? seg[0] : (owner+".github.io");
    list.push("https://raw.githubusercontent.com/"+owner+"/"+repo+"/main/"+repoFile);
    list.push("https://raw.githubusercontent.com/"+owner+"/"+repo+"/master/"+repoFile);
  }
  list.push(dir+repoFile);   // 상대경로 (Pages가 서빙)
  return list;
}

function fetchData(){
  var cands=candidates(), i=0;
  var tryNext=function(){
    if(i>=cands.length){ render(true); return; }
    var url=cands[i++], bust=url+(url.indexOf("?")>=0?"&":"?")+"t="+Date.now();
    fetch(bust,{cache:"no-store"}).then(function(r){
      if(!r.ok) throw 0; return r.json();
    }).then(function(j){
      if(!j || j.kind!=="nunkeum-schedule" || !Array.isArray(j.events)) throw 0;
      data=j; srcUrl=url; lastAt=Date.now();
      try{ localStorage.setItem("nunkeum:schedUrl",url); }catch(e){}
      render();
    }).catch(function(){ tryNext(); });
  };
  tryNext();
}

function render(failed){
  var h=[];
  h.push('<div id="top"><div><div class="hint" style="font-size:11px">일정</div>'+
    '<div class="d">앞으로의 일정</div></div>'+
    '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">'+
    '<span class="ro">읽기 전용</span>'+
    '<button onclick="toggleTheme()" style="min-height:32px;padding:5px 11px">'+(theme==="dark"?"☀":"☾")+'</button></div></div>');

  if(failed && !data){
    h.push('<div class="c"><div class="hint">일정을 불러오지 못했어요. 주소가 맞는지 아래에 직접 넣어볼 수 있어요.</div>'+
      '<div style="margin-top:10px"><input id="u" placeholder="events.json 주소 붙여넣기"></div>'+
      '<div style="margin-top:9px"><button onclick="useUrl()">이 주소로 보기</button></div></div>');
    document.getElementById("app").innerHTML=h.join("");
    return;
  }
  if(!data){ h.push('<div class="c"><div class="hint">불러오는 중…</div></div>');
    document.getElementById("app").innerHTML=h.join(""); return; }

  var evs=(data.events||[]).slice().filter(function(e){ return e.date; })
    .sort(function(a,b){ if(a.date!==b.date) return a.date<b.date?-1:1;
      return (a.start||"25:00").localeCompare(b.start||"25:00"); });
  var up=evs.filter(function(e){ return dLeft(e.date)>=0; });
  var starFuture=evs.filter(function(e){ return dLeft(e.date)>=0 && e.star; });

  if(starFuture.length){
    h.push('<div class="anc">중요 ★</div><div class="c">');
    starFuture.forEach(function(e){ h.push(row(e)); });
    h.push('</div>');
  }
  h.push('<div class="anc">앞으로</div><div class="c">');
  if(!up.length) h.push('<div class="hint">앞으로 잡힌 일정이 없어요.</div>');
  up.slice(0,60).forEach(function(e){ h.push(row(e)); });
  h.push('</div>');

  var ago=lastAt?Math.round((Date.now()-lastAt)/1000):0;
  var when=ago<60?"방금":ago<3600?Math.floor(ago/60)+"분 전":Math.floor(ago/3600)+"시간 전";
  h.push('<div class="hint" style="text-align:center;margin-top:6px">'+
    '✓ '+when+' 업데이트 · 자동 새로고침 <button onclick="fetchData()" style="min-height:30px;padding:4px 10px;margin-left:6px">지금 새로고침</button></div>');

  document.getElementById("app").innerHTML=h.join("");
}
function row(e){
  var n=dLeft(e.date), soon=n>=0&&n<=3;
  return '<div class="ev">'+
    (e.star?'<span class="star">★</span>':'')+
    '<span class="dd'+(soon?" soon":"")+'">'+dLabel(n)+'</span>'+
    '<span class="dateln n">'+esc(e.date.slice(5).replace("-","."))+' '+dowOf(e.date)+'</span>'+
    '<span class="tm n">'+(e.start?esc(e.start):"—")+'</span>'+
    '<span class="t"'+(soon||e.star?' style="font-weight:600"':'')+'>'+esc(e.title)+'</span></div>';
}
function toggleTheme(){ theme=theme==="dark"?"light":"dark"; document.documentElement.setAttribute("data-t",theme); render(); }
function useUrl(){
  var u=(document.getElementById("u")||{}).value||""; u=u.trim(); if(!u) return;
  try{ localStorage.setItem("nunkeum:schedUrl",u); }catch(e){}
  data=null; render(); fetchData();
}

render();
fetchData();
timer=setInterval(function(){ if(document.visibilityState==="visible") fetchData(); }, 60000);
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") fetchData(); });
</script>
</body>
</html>
